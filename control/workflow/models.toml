# 模型注册表：链路只声明能力，具体模型由这里解析。
#
# 规则：
#   1. verified_at 为空 → runner 拒绝调用（型号/价格没核实过，不能用来算预算）
#   2. 未写 cost_in_per_1k / cost_out_per_1k → 能调用但不计费（cost_yuan 为 null）
#   3. 价格来源：https://bigmodel.cn/pricing（2026-10-29 核对，元/百万 tokens ÷ 1000 = 元/千 tokens）

[models."glm-5.3"]
provider    = "zhipu"
endpoint    = "https://open.bigmodel.cn/api/paas/v4"
model       = "glm-5.3"
key_env     = "ZHIPU_API_KEY"
capabilities = ["text.reason", "text.long", "json.mode"]
context      = 1000000
verified_at  = "2026-10-29"
verified_from = "https://bigmodel.cn/pricing"
cost_in_per_1k  = 0.008     # 8 元/M
cost_out_per_1k = 0.028     # 28 元/M

