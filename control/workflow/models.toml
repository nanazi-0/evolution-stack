model       = "glm-4.6"
key_env     = "ZHIPU_API_KEY"
capabilities = ["text.reason", "text.long", "json.mode"]
context      = 200000
verified_at  = "2026-10-29"      # 实测可用；价格页未列此型号，未填价格
verified_from = "实测调用成功"

